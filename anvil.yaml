allow_embedding: false
db_schema:
  files:
    client: full
    columns:
    - admin_ui: {order: 0, width: 200}
      name: path
      type: string
    - admin_ui: {order: 1, width: 360}
      name: file
      type: media
    - admin_ui: {order: 2, width: 200}
      name: file_version
      type: string
    server: full
    title: Files
  inventory:
    client: full
    columns:
    - admin_ui: {order: 0, width: 123}
      name: Item
      type: string
    - admin_ui: {order: 2, width: 125}
      name: Minimum_Amt
      type: number
    - admin_ui: {order: 3, width: 200}
      name: To_Order
      type: number
    - admin_ui: {order: 4, width: 200}
      name: Notes
      type: string
    - admin_ui: {order: 5, width: 200}
      name: Category
      type: string
    - admin_ui: {order: 1, width: 117}
      name: On_Hand
      type: number
    server: full
    title: inventory
dependencies: []
metadata: {logo_img: 'asset:Home Picture.png', title: AOC supplies}
name: inventory
package_name: inventory
renamed: true
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {base: python310-standard}
  server_spec_disabled: {base: python310-minimal, requirements: ''}
  server_version: python3-sandbox
  version: 3
services:
- client_config: {}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {}
  server_config: {file_table: files}
  source: /runtime/services/anvil/files.yml
startup_form: Form1
