components:
- event_bindings: {change: check_ordered_change}
  layout_properties: {column: RTETBL}
  name: check_ordered
  properties: {role: shopping-order-check}
  type: CheckBox
- components:
  - name: link_item
    properties: {role: shopping-item-link}
    type: Link
  - event_bindings: {click: add_purchase_link_click}
    name: add_purchase_link
    properties: {text: Add purchase link, visible: false}
    type: Link
  layout_properties: {column: VJQQOR}
  name: item_details
  type: LinearPanel
- layout_properties: {column: JKSDUP}
  name: lbl_dept
  properties: {}
  type: Label
- layout_properties: {column: LBWNFU}
  name: lbl_qty
  properties: {bold: true, role: inventory-quantity}
  type: Label
- layout_properties: {column: OJLQEN}
  name: lbl_price
  properties: {role: inventory-quantity}
  type: Label
container: {type: DataRowPanel}
is_package: true
