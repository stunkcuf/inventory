components:
- layout_properties: {column: JKSDUP}
  name: lbl_dept
  properties: {text: 'self.item[''Category'']'}
  type: Label
- layout_properties: {column: VJQQOR}
  name: link_item
  properties: {text: 'self.item[''Item'']', url: 'self.item[''Item_Link'']'}
  type: Link
- layout_properties: {column: OJLQEN}
  name: lbl_price
  properties: {text: 'f"${self.item[''Price'']:.2f}"'}
  type: Label
- layout_properties: {column: LBWNFU}
  name: lbl_qty
  properties: {text: 'self.item[''To_Order'']'}
  type: Label
- data_bindings:
  - {code: 'self.item[''Ordered'']', property: checked, writeback: false}
  layout_properties: {column: RTETBL}
  name: check_ordered
  properties: {checked: true, text: ''}
  type: CheckBox
container: {type: DataRowPanel}
is_package: true
