components:
- layout_properties: {full_width_row: true, grid_position: 'LISTHD,MEVMML'}
  name: label_1
  properties: {role: inventory-page-heading, text: Shopping List}
  type: Label
- components:
  - name: label_summary
    properties: {role: workspace-status}
    type: Label
  - event_bindings: {click: print_button_click}
    name: print_button
    properties: {icon: 'fa:print', role: workspace-button, text: Print}
    type: Button
  - event_bindings: {click: refresh_button_click}
    name: refresh_button
    properties: {icon: 'fa:refresh', role: workspace-button, text: Refresh}
    type: Button
  layout_properties: {full_width_row: true, grid_position: 'LISTOP,STATUS'}
  name: list_toolbar
  properties: {align: left, role: shopping-list-toolbar}
  type: FlowPanel
- layout_properties: {full_width_row: true, grid_position: 'LISTCT,GROUPS'}
  name: supplier_sections
  properties: {}
  type: LinearPanel
container: {type: ColumnPanel}
is_package: true
