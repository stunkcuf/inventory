components:
- event_bindings: {change: refresh_orders}
  layout_properties: {grid_position: 'FILTER,STATUS'}
  name: dd_filter_status
  properties: {tooltip: Filter by status}
  type: DropDown
- event_bindings: {click: refresh_orders}
  layout_properties: {grid_position: 'FILTER,RELOAD'}
  name: refresh_button
  properties: {icon: 'fa:refresh', role: workspace-button, text: Refresh}
  type: Button
- layout_properties: {grid_position: 'ORDERS,COUNTS'}
  name: label_summary
  properties: {role: workspace-status}
  type: Label
- layout_properties: {grid_position: 'RESULT,ORDERS'}
  name: order_list
  properties: {}
  type: LinearPanel
container: {type: ColumnPanel}
is_package: true
