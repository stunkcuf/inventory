components:
- components:
  - event_bindings: {pressed_enter: tb_search_pressed_enter}
    layout_properties: {grid_position: 'SEARCH,ITEMS'}
    name: tb_search
    properties: {placeholder: Search items and press Enter, tooltip: Search inventory}
    type: TextBox
  - event_bindings: {change: drop_down_filter_change}
    layout_properties: {grid_position: 'SEARCH,CATEGY'}
    name: drop_down_filter
    properties: {tooltip: Filter by inventory category}
    type: DropDown
  - event_bindings: {change: drop_down_subcategory_change}
    layout_properties: {grid_position: 'SEARCH,SUBCAT'}
    name: drop_down_subcategory
    properties: {tooltip: Filter by subcategory}
    type: DropDown
  - components:
    - event_bindings: {click: button_update_stock_click}
      name: button_update_stock
      properties: {icon: 'fa:exchange', role: workspace-button, text: Update stock}
      type: Button
    - event_bindings: {click: button_add_click}
      name: button_add
      properties: {icon: 'fa:plus', role: workspace-primary, text: Add product}
      type: Button
    layout_properties: {grid_position: 'SEARCH,ACTION'}
    name: stock_actions
    properties: {align: right}
    type: FlowPanel
  layout_properties: {full_width_row: true, grid_position: 'TOOLBR,FILTER'}
  name: inventory_toolbar
  properties:
    col_widths: '{"ITEMS":17,"CATEGY":11,"SUBCAT":13,"ACTION":19}'
    role: workspace-surface
  type: ColumnPanel
- components:
  - name: repeating_panel_1
    properties: {item_template: MainForm.InventoryForm.RowTemplate2}
    type: RepeatingPanel
  layout_properties: {full_width_row: true, grid_position: 'LTKURE,TMYPSI'}
  name: data_grid_1
  properties:
    role: inventory-table
    columns:
    - {data_key: label_name, id: JKSDUP, title: Item}
    - {data_key: label_on_hand, id: VJQQOR, expand: false, title: On hand, width: 96}
    - {data_key: label_min_amt, id: OJLQEN, expand: false, title: Minimum, width: 96}
    - {data_key: label_to_order, id: WHXONE, expand: false, title: To order, width: 96}
    - {data_key: label_category, id: EETLTO, expand: false, title: Category, width: 110}
    - {data_key: Buttons, id: HKMLCQ, expand: false, title: Actions, width: 160}
  type: DataGrid
container: {type: ColumnPanel}
is_package: true
