components:
- event_bindings: {change: tb_search_change}
  layout_properties: {grid_position: 'KYIKQS,VCDBXX'}
  name: tb_search
  properties: {placeholder: Search for an item (e.g. Gloves)...}
  type: TextBox
- event_bindings: {}
  layout_properties: {grid_position: 'KYIKQS,RXLNSK ZXLJRT,DLPCZZ'}
  name: drop_down_filter
  properties:
    items: ['["All", "Office", "Center"]']
  type: DropDown
- event_bindings: {click: button_add_click}
  layout_properties: {grid_position: 'KYIKQS,IQTZXJ PWJPNN,FTJIIV'}
  name: button_add
  properties: {align: right, background: 'theme:Primary Container', text: Add Product}
  type: Button
- event_bindings: {click: button_update_stock_click}
  layout_properties: {grid_position: 'KYIKQS,IQTZXJ VMHXWT,BOSWKU'}
  name: button_update_stock
  properties: {align: right, background: 'theme:Primary Container', text: update stock}
  type: Button
- components:
  - name: repeating_panel_1
    properties: {item_template: MainForm.InventoryForm.RowTemplate2}
    type: RepeatingPanel
  layout_properties: {grid_position: 'LTKURE,TMYPSI'}
  name: data_grid_1
  properties:
    columns:
    - {data_key: label_name, id: JKSDUP, title: Item}
    - {data_key: label_on_hand, id: VJQQOR, title: On Hand}
    - {data_key: label_min_amt, id: OJLQEN, title: Min. Amt.}
    - {data_key: label_to_order, id: WHXONE, title: To Order}
    - {data_key: label_category, id: EETLTO, title: Category}
    - {data_key: Buttons, id: HKMLCQ, title: ''}
  type: DataGrid
container: {type: ColumnPanel}
is_package: true
