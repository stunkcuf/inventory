components:
- components:
  - data_bindings:
    - {code: 'self.item[''Item'']', property: text, writeback: false}
    layout_properties: {grid_position: 'WILZZU,KJBWPD'}
    name: label_name
    properties: {text: ''}
    type: Label
  - data_bindings:
    - {code: 'self.item[''On_Hand'']', property: text, writeback: false}
    layout_properties: {grid_position: 'WILZZU,ANGDCJ'}
    name: label_on_hand
    properties: {align: center, text: ''}
    type: Label
  - data_bindings:
    - {code: 'self.item[''Minimum_Amt'']', property: text, writeback: false}
    layout_properties: {grid_position: 'WILZZU,DCKXEL'}
    name: label_min_amt
    properties: {align: left, text: ''}
    type: Label
  - data_bindings:
    - {code: self.quantity_to_order(), property: text, writeback: false}
    layout_properties: {grid_position: 'WILZZU,PZJDYF'}
    name: label_to_order
    properties: {align: center, text: ''}
    type: Label
  - data_bindings:
    - {code: 'self.item[''Category'']', property: text, writeback: false}
    layout_properties: {grid_position: 'WILZZU,QLGYAA'}
    name: label_category
    properties: {align: right, text: ''}
    type: Label
  - components:
    - event_bindings: {click: btn_minus_click}
      layout_properties: {}
      name: button_minus
      properties:
        align: center
        font_size: 15
        icon: fa:minus
        text: |2+

      type: Button
    layout_properties: {grid_position: 'WILZZU,BBZTCM'}
    name: flow_panel_1
    properties: {align: center}
    type: FlowPanel
  - components:
    - event_bindings: {click: btn_plus_click}
      layout_properties: {}
      name: button_plus
      properties: {align: center, font_size: 15, icon: 'fa:plus', text: ''}
      type: Button
    layout_properties: {grid_position: 'WILZZU,FKZWQX'}
    name: flow_panel_2
    properties: {align: center, vertical_align: full}
    type: FlowPanel
  - components:
    - event_bindings: {click: btn_delete_click}
      layout_properties: {}
      name: button_delete
      properties: {align: center, background: 'theme:Primary Container', font_size: 15, icon: 'fa:trash', text: '', visible: true}
      type: Button
    layout_properties: {grid_position: 'WILZZU,YOJFJJ'}
    name: flow_panel_3
    properties: {align: center}
    type: FlowPanel
  layout_properties: {}
  name: column_panel_1
  properties:
    border: '2'
    col_spacing: tiny
    col_widths: '{"KJBWPD":8,"ANGDCJ":12,"DCKXEL":10,"PZJDYF":5,"QLGYAA":10,"BBZTCM":5,"FKZWQX":5,"YOJFJJ":5}'
    spacing:
      padding: [0, 0, 2, 5]
    visible: true
    wrap_on: never
  type: ColumnPanel
container: {type: DataRowPanel}
is_package: true
