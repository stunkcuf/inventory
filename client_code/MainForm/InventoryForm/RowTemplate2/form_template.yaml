components:
- data_bindings:
  - {code: 'self.item[''Item'']', property: text, writeback: false}
  layout_properties: {column: JKSDUP}
  name: label_name
  properties: {bold: true}
  type: Label
- data_bindings:
  - {code: 'self.item[''On_Hand'']', property: text, writeback: false}
  layout_properties: {column: VJQQOR}
  name: label_on_hand
  properties: {role: inventory-quantity}
  type: Label
- data_bindings:
  - {code: 'self.item[''Minimum_Amt'']', property: text, writeback: false}
  layout_properties: {column: OJLQEN}
  name: label_min_amt
  properties: {role: inventory-quantity}
  type: Label
- data_bindings:
  - {code: self.quantity_to_order(), property: text, writeback: false}
  - {code: "'inventory-shortage' if self.quantity_to_order() else 'inventory-quantity'", property: role, writeback: false}
  layout_properties: {column: WHXONE}
  name: label_to_order
  type: Label
- data_bindings:
  - {code: 'self.item[''Category'']', property: text, writeback: false}
  layout_properties: {column: EETLTO}
  name: label_category
  type: Label
- components:
  - event_bindings: {click: btn_minus_click}
    name: button_minus
    properties: {icon: 'fa:minus', role: inventory-row-action, tooltip: Issue one unit}
    type: Button
  - event_bindings: {click: btn_plus_click}
    name: button_plus
    properties: {icon: 'fa:plus', role: inventory-row-action, tooltip: Receive one unit}
    type: Button
  - event_bindings: {click: btn_delete_click}
    name: button_delete
    properties: {icon: 'fa:trash', role: inventory-remove-action, tooltip: Delete item}
    type: Button
  layout_properties: {column: HKMLCQ}
  name: row_actions
  properties: {align: left, role: inventory-row-actions, spacing: none}
  type: FlowPanel
container:
  properties: {role: inventory-table-row}
  type: DataRowPanel
is_package: true
