components:
- components:
  - name: import_heading
    properties: {bold: true, font_size: 18, text: Inventory import}
    type: Label
  - name: import_description
    properties: {text: Upload an Excel workbook. Some import modes replace existing rows.}
    type: Label
  - event_bindings: {change: file_loader_1_change}
    name: file_loader_1
    properties: {icon: 'fa:upload', role: workspace-primary, text: Choose workbook}
    type: FileLoader
  layout_properties: {grid_position: 'ADMINR,IMPORT'}
  name: import_panel
  properties: {role: inventory-admin-card}
  type: LinearPanel
- components:
  - name: integrations_heading
    properties: {bold: true, font_size: 18, text: Order intake}
    type: Label
  - name: integrations_description
    properties: {text: Get the webhook URLs for incoming MachForm submissions.}
    type: Label
  - event_bindings: {click: machform_integration_click}
    name: link_machform_integration
    properties: {icon: 'fa:link', text: MachForm Integration}
    type: Link
  layout_properties: {grid_position: 'ADMINR,INTAKE'}
  name: integrations_panel
  properties: {role: inventory-admin-card}
  type: LinearPanel
- components:
  - name: audit_heading
    properties: {bold: true, font_size: 18, text: Activity}
    type: Label
  - name: audit_description
    properties: {text: Review recorded changes to inventory and other tables.}
    type: Label
  - event_bindings: {click: link_audit_logs_click}
    name: link_audit_logs
    properties: {icon: 'fa:clipboard', text: Audit Logs}
    type: Link
  layout_properties: {grid_position: 'ADMINR,REVIEW'}
  name: audit_panel
  properties: {role: inventory-admin-card}
  type: LinearPanel
container: {type: ColumnPanel}
is_package: true
